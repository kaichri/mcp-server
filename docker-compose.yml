services:
  mcp-server:
    build: .
    container_name: synology-mcp
    restart: unless-stopped

    env_file:
      - ./config.env

    ports:
      - "${MCP_LAN_BIND_IP:-192.168.1.50}:8000:8000"
      - "127.0.0.1:8001:8001"

    environment:
      TZ: Europe/Vienna
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      MCP_ALLOW_LEGACY_TOKEN: ${MCP_ALLOW_LEGACY_TOKEN:-true}
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:-https://mcp.example.com}
      MCP_LAN_HOST: ${MCP_LAN_BIND_IP:-192.168.1.50}
      MCP_OAUTH_USERNAME: ${MCP_OAUTH_USERNAME:?Set MCP_OAUTH_USERNAME in .env}
      MCP_OAUTH_PASSWORD_HASH_FILE: /run/secrets/oauth_password_hash
      MCP_OAUTH_DATABASE: /data/oauth.sqlite3
      MCP_ACCESS_TOKEN_SECONDS: ${MCP_ACCESS_TOKEN_SECONDS:-3600}
      MCP_REFRESH_TOKEN_SECONDS: ${MCP_REFRESH_TOKEN_SECONDS:-63072000}
      MCP_AUTH_CODE_SECONDS: ${MCP_AUTH_CODE_SECONDS:-120}
      MCP_X_CACHE_ENABLED: ${MCP_X_CACHE_ENABLED:-true}
      MCP_X_CACHE_PATH: /data/x-public.sqlite3

    volumes:
      - oauth-data:/data
    secrets:
      - oauth_password_hash

volumes:
  oauth-data:

secrets:
  oauth_password_hash:
    file: ./secrets/oauth-password-hash.txt
